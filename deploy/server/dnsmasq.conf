# Answers two kinds of clients: the DoH bridge on loopback (every public
# device) and the WireGuard tunnel. Never bound to the public interface: plain
# UDP DNS open to the internet gets abused for amplification attacks.
listen-address=127.0.0.1,10.77.0.1
bind-dynamic
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9
cache-size=10000
domain-needed
bogus-priv
conf-file=/etc/anssiscanvdns/dnsmasq.rules.conf
