# Resolver for tunnel clients only: bound to the WireGuard address, never the
# public interface (an open resolver gets abused for DNS amplification).
interface=wg0
bind-dynamic
except-interface=lo
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9
cache-size=10000
domain-needed
bogus-priv
conf-file=/etc/anssiscanvdns/dnsmasq.rules.conf
